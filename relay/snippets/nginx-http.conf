# For relay/snippets/nginx.conf, in nginx's http block. relay/install.sh
# installs this file as /etc/nginx/tacitus-relay/http.conf, past nginx -t:
# the http block takes `include /etc/nginx/tacitus-relay/http.conf;`, never
# a path in the clone, and no other copy of it (two copies define each zone
# twice). Without it the server block's limits name zones that do not
# exist, and nginx -t fails.

# Per client address: 20 requests a second (a burst of 100), 32 connections.
# A carrier's NAT puts many phones behind one address; raise these there.
limit_req_zone $binary_remote_addr zone=tacitus_relay:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=tacitus_relay_conn:10m;
# A computer's lookup of its handoff mailbox: 20 a minute per address.
limit_req_zone $binary_remote_addr zone=tacitus_relay_handoff:10m rate=20r/m;

# 1 for a POST without X-Relay-Key: a phone's frame route refuses it before
# the relay sees it. A CORS preflight (OPTIONS) and a stream's GET carry no key.
map "$request_method:$http_x_relay_key" $tacitus_relay_nokey {
    default 0;
    "POST:" 1;
}
