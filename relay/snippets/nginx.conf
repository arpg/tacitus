# Put inside the existing HTTPS server block of the relay's host. TLS stays
# with nginx; the relay listens on localhost. The trailing slash on
# proxy_pass strips the /relay/ prefix, so the relay sees /r/..., /sse and
# /healthz as its own paths and the bot's relay URL is https://<host>/relay.

location = /relay { return 301 /relay/; }

location /relay/ {
    proxy_pass http://127.0.0.1:8471/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Event streams and long polls: no buffering, and a read timeout past
    # the long poll's wait.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 16m;
}
