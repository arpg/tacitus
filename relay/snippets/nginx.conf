# The relay under /relay/ of an existing HTTPS server block; the bot's relay
# URL is then https://<host>/relay (docs/webchat-relay.md, Running the relay).
# TLS stays with nginx and the relay listens on localhost. This block needs
# relay/snippets/nginx-http.conf in the http block: the rate zones and the
# key check it names are defined there.
#
# This relay serves no app (the unit runs it without --static). The other
# pages of this host share its origin, and any script on that origin could
# use a phone's key; a relay that serves the app gets a hostname of its own.

location = /relay { return 301 /relay/; }

# The counts in /healthz tell when an install is online: for a monitor on
# this host only (http://127.0.0.1:8471/healthz).
location = /relay/healthz { access_log off; return 404; }

# ^~: no regex location of the site (a `~* \.js$`, say) takes these paths.
location ^~ /relay/ {
    # The trailing slash strips the /relay/ prefix.
    proxy_pass http://127.0.0.1:8471/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Nothing the relay answers steers nginx or sets anything for the site.
    proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate
                         X-Accel-Charset X-Accel-Buffering;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Service-Worker-Allowed;
    # Event streams and long polls: no buffering, and a read timeout past
    # the long poll's wait.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # Per client address, before the relay's own limits per install.
    limit_req zone=tacitus_relay burst=100 nodelay;
    limit_conn tacitus_relay_conn 32;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level info;
    limit_conn_log_level info;
    # Small bodies but on the two frame routes below. No access log, and the
    # refusals above at info: a log line would hold an install id, a client
    # address and a stream's ticket.
    client_max_body_size 8k;
    access_log off;

    # The bot's poll and a phone's frame: up to 16 MiB, and only with the
    # credential header (the relay checks it too, before it reads a body).
    location ~ "^/relay/r/[a-z2-7]{26}/bot$" {
        if ($http_authorization = "") { return 401; }
        client_max_body_size 16m;
        rewrite ^/relay(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8471;
    }
    location ~ "^/relay/r/[a-z2-7]{26}/c$" {
        if ($tacitus_relay_nokey) { return 401; }
        client_max_body_size 16m;
        rewrite ^/relay(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8471;
    }
    # A stream's `open` frame (a POST with the key) and its GET (a ticket).
    location ~ "^/relay/r/[a-z2-7]{26}/sse$" {
        if ($tacitus_relay_nokey) { return 401; }
        rewrite ^/relay(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8471;
    }
}
