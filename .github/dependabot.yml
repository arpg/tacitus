# Dependency updates once a month, grouped, so they cost one pull request
# each rather than one per package. CI lints them; add full-ci before
# merging a group that moves ortools, playwright or the Google libraries.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
