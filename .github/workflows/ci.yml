# CI: the three tiers docs/install-testing.md describes.
#
#   lint-and-validate   the secrets lint, the config templates, the syntax
#                       of the bot and the preprocessor (ubuntu, every run)
#   wall                tier 1: the unit wall with no accounts, on
#                       ubuntu-22.04 (Python 3.10, the floor), ubuntu-latest
#                       and macos-latest (a macOS minute costs ten Linux
#                       minutes on a private repo)
#   wall-docker         the wall in the image, with the two-user layout
#   bootstrap-linux     install.sh as a new user runs it
#   install-smoke-linux tier 2: the install end to end on a fresh runner
#                       with no accounts (tests/install/smoke.sh)
#   install-smoke-macos tier 2 on macOS, and bootstrap-macos: tags and
#                       Run workflow only
#
# Every push to main and every tag runs the full tiers (the repository is
# public, so standard runners cost nothing). A pull request runs the lint,
# and the tiers only on a full run:
#   - a pull request with the `full-ci` label (adding the label starts the
#     run, through full-ci-label.yml);
#   - Actions > CI > Run workflow on a branch.
# Without a full run the wall legs start, skip every step and report, so
# the checks branch protection requires still arrive; the other jobs
# report skipped, which counts as passed. A draft runs nothing, and a new
# push cancels the pull request's run in progress. A first pull request
# from a fork waits for a maintainer to approve its workflow run.
#
# The `ci` job at the end sums the others up: it fails when any of them
# failed or was cancelled and passes when they passed or were skipped, so
# branch protection requires that one check and the list of job names can
# change without a settings change.
#
# Tier 3, the release suite, needs a login and runs on the owner's machine
# (docs/EVAL.md, "Release tests"). Every action is pinned to a version; the
# release job's, by commit.
#
# `release` runs after `ci` on a push to main that passed: it signs the
# next vX.Y.Z tag on that commit with the SSH key in the secret
# RELEASE_SIGNING_KEY, moves channels/latest, and creates a GitHub Release
# for the tag with the notes scripts/release_notes.py writes
# (docs/updates.md). Installs install only tags on main that verify
# against the release key they pinned; the notes are what they tell their
# owner. The secret lives in the `release` environment (main only, a
# required reviewer), and only one shell step reads it (docs/updates.md,
# Supply chain).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per pull request: a new push cancels the run in progress. Every
  # other run has a group of its own, so pushes to main never wait or cancel.
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Secrets lint
        run: ./tests/secrets_lint.sh

      - name: Validate config templates
        run: python3 tests/validate_config.py --ci

      - name: Python syntax check
        run: python3 -m py_compile ea-chat-bot.py && echo "ea-chat-bot.py OK"

      - name: Check preprocessor imports
        run: |
          cd preprocessor
          for f in *.py; do
            python3 -c "import ast; ast.parse(open('$f').read())" && echo "$f OK"
          done

  wall:
    name: wall (${{ matrix.os }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        # Every leg is in the matrix; a pull request without full-ci reports without testing.
        os: ${{ fromJSON('["ubuntu-22.04", "ubuntu-latest", "macos-latest"]') }}
    # Without a full run every leg runs on a Linux runner and skips every
    # step, so its required check still reports (a leg left out of the
    # matrix would never report, and a skipped matrix job reports under
    # an unexpanded name).
    runs-on: ${{ (contains(github.event.pull_request.labels.*.name, 'full-ci') || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && matrix.os || 'ubuntu-latest' }}
    env:
      LEG_TESTS: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: env.LEG_TESTS == 'true'

      - uses: actions/setup-python@v7.0.0
        if: env.LEG_TESTS == 'true'
        with:
          # 3.10 is the floor docs/SETUP.md states; the other legs take a current release.
          python-version: ${{ matrix.os == 'ubuntu-22.04' && '3.10' || '3.12' }}

      - name: Install dependencies
        if: env.LEG_TESTS == 'true'
        # requirements.txt is the runtime set; the wall also needs pytest and
        # PyYAML (the container lock has it, the host file does not).
        run: python3 -m pip install -r requirements.txt pytest pyyaml

      - name: poppler (pdftotext) on Linux
        if: env.LEG_TESTS == 'true' && runner.os == 'Linux'
        # The runner image's package index goes stale between image builds,
        # and a stale index 404s on the current poppler build.
        run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils

      - name: Point HOME and EA_DIR at empty directories
        if: env.LEG_TESTS == 'true'
        # Nothing the wall runs may read a real install, so HOME and EA_DIR
        # are empty directories the tests may create under (a path that
        # cannot be made fails the tests that build their own EA_DIR). The
        # zone the suite states its clocks in is set by the suite itself
        # (tests/conftest.py SUITE_TZ).
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/ea"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "EA_DIR=$RUNNER_TEMP/ea" >> "$GITHUB_ENV"

      - name: Test wall
        if: env.LEG_TESTS == 'true'
        env:
          WALL_VERBOSE: "1"
        run: python3 tests/run_wall.py

      - name: Secrets lint
        if: env.LEG_TESTS == 'true'
        run: bash tests/secrets_lint.sh

      - name: Validate config templates
        if: env.LEG_TESTS == 'true'
        run: python3 tests/validate_config.py --ci

  wall-docker:
    # The whole wall on Linux with the two-user layout: the image holds the
    # owner and ea-bot with the sudoers rule between them, so the tests of
    # the owner-resident boundary run here for real (a bare runner skips
    # them). The build is the same image Docker users run.
    if: contains(github.event.pull_request.labels.*.name, 'full-ci') || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build the image
        run: docker build -t ea-system:ci .

      - name: Test wall in the image
        run: |
          docker run --rm --user owner -e HOME=/home/owner -e WALL_VERBOSE=1 \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 ea-system:ci \
            sh -c 'python3 -m pip install -q --user pytest pyyaml && cd /opt/ea-system && python3 tests/run_wall.py'

  bootstrap-linux:
    # The one-command install as a new user runs it: the real Claude Code
    # installer and pip, then the hand-off it prints. No login, no quota.
    if: contains(github.event.pull_request.labels.*.name, 'full-ci') || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: install.sh --no-launch, twice
        run: |
          ./install.sh --no-launch
          test -x "$HOME/.local/bin/claude"
          "$HOME/.local/bin/claude" --version
          ./install.sh --no-launch | tee second.txt
          grep -q "already installed" second.txt

  bootstrap-macos:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: install.sh --no-launch
        run: |
          brew list python@3.12 >/dev/null 2>&1 || brew install python@3.12
          ./install.sh --no-launch
          "$HOME/.local/bin/claude" --version

  install-smoke-linux:
    if: contains(github.event.pull_request.labels.*.name, 'full-ci') || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install smoke (email profile, no accounts)
        # The runner's own python3 and passwordless sudo: the path a new
        # user's machine takes. The job ends with the doctor's status.
        run: bash tests/install/smoke.sh

  install-smoke-macos:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Homebrew python 3.12
        # Apple's /usr/bin/python3 is 3.9; the smoke uses a Homebrew
        # interpreter, which ea-bot can reach (the runner's home cannot be).
        # 3.12, the version install.sh names: Homebrew's newest python3 can
        # run ahead of the wheels some requirements publish.
        run: brew list python@3.12 >/dev/null 2>&1 || brew install python@3.12

      - name: Install smoke (email profile, no accounts)
        env:
          # libexec/bin holds an unversioned python3, so the directory
          # the smoke puts first on PATH answers 3.12 to scripts/install/setup.sh's `python3`.
          EA_SMOKE_PYTHON: /opt/homebrew/opt/python@3.12/libexec/bin/python3
        run: bash tests/install/smoke.sh

  ci:
    # The one check branch protection requires. always() keeps it running
    # when a job it needs was skipped; the step reads each result.
    if: always()
    needs: [lint-and-validate, wall, wall-docker, bootstrap-linux, bootstrap-macos, install-smoke-linux, install-smoke-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          bad=$(echo "$RESULTS" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(" ".join(k for k,v in d.items() if v["result"] not in ("success","skipped")))')
          if [ -n "$bad" ]; then echo "::error::failed or cancelled: $bad"; exit 1; fi

  release:
    # Every green push to main is a release (docs/updates.md). The job
    # signs an annotated tag vX.Y.Z on the commit the tiers just passed:
    # the patch number one above the newest release in main's history, or
    # the minor or major one when the released commit itself (the merge or
    # squash commit) or its pull request's body has a standalone #minor or
    # #major, or a footer line `release: minor` (or major); an older
    # commit's message never raises it. A commit a newer release already
    # contains gets none. One release at a time (the concurrency group), so
    # two runs never compute the same number. Without the secret the job
    # warns and tags nothing. A tag pushed with the workflow's token starts
    # no workflow, so the release does not run CI a second time. Once the
    # tag is pushed, a GitHub Release for it carries the release notes; a
    # Release that cannot be made is a warning, since the signed tag is the
    # release and the notes only describe it.
    #
    # The signing key: the secret belongs to the `release` environment,
    # which the owner sets to deploy from main only, behind a required
    # reviewer (docs/updates.md, Supply chain; GitHub makes a missing
    # environment on first use, with no protection). One step reads it,
    # with shell, ssh-keygen and git only: no Python step, and no other
    # step, runs with RELEASE_SIGNING_KEY in its environment, and the key
    # file is gone when that step ends.
    # !cancelled() replaces the implicit success() check, which reads as
    # skipped when the always() summary job sits over skipped tiers.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci.result == 'success' }}
    needs: [ci]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # The version marker in the pull request's body.
      pull-requests: read
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Next version
        id: next
        env:
          # The pull request's body may hold the marker.
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::notice::the signing key comes from the release environment; its protection (main only, a required reviewer) is a repository setting this job cannot see (docs/updates.md, Supply chain)"
          git fetch --force --tags origin
          tag=$(python3 scripts/update.py next-version --head "$GITHUB_SHA" --main origin/main --github-repo "$GITHUB_REPOSITORY")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "next release: ${tag:-none (a newer release contains $GITHUB_SHA)}"

      - name: Allowed signers
        if: steps.next.outputs.tag != ''
        run: python3 scripts/update.py allowed-signers --key .release-key.pub > "$RUNNER_TEMP/allowed_signers"

      - name: Sign the tag
        # The only step with the secret: shell, ssh-keygen and git. It
        # writes the key to a 0600 file, removes it on exit, and exports
        # nothing but the step output `signed`.
        id: sign
        if: steps.next.outputs.tag != ''
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -eu
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::warning::RELEASE_SIGNING_KEY is not set in the release environment: no release tag (docs/updates.md, One-time setup)"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/release-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          # The secret's public half must be the committed trust root, or
          # every install would refuse the tag.
          pub=$(ssh-keygen -y -f "$key" | awk '{print $2}')
          if ! grep -qF "$pub" .release-key.pub; then
            echo "::error::the signing key in RELEASE_SIGNING_KEY is not in .release-key.pub"
            exit 1
          fi
          git -c user.name="tacitus-release" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              -c gpg.format=ssh -c user.signingkey="$key" \
              tag -s -m "$TAG" -m "Commit ${GITHUB_SHA::7}; CI run ${GITHUB_RUN_ID}" "$TAG" "$GITHUB_SHA"
          rm -f "$key"
          git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" verify-tag "$TAG"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Verify and push the tag
        id: push
        if: steps.sign.outputs.signed == 'true'
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -eu
          python3 scripts/update.py verify-tag --repo . --tag "$TAG" --key .release-key.pub
          git tag -f channels/latest "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          git push --force origin refs/tags/channels/latest
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "released $TAG at ${GITHUB_SHA::7}"

      - name: Create the GitHub Release with the notes
        # The changes since the previous release (the pull request titles of
        # the merge commits) and the owner steps from the commit messages
        # (docs/updates.md, "Release notes"). Every failure here warns and
        # leaves the job green.
        if: steps.push.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if ! python3 scripts/release_notes.py --tag "$TAG" --github-repo "$GITHUB_REPOSITORY" > "$notes"; then
            echo "::warning::scripts/release_notes.py failed for $TAG; the Release says only the tag"
            printf 'Release %s.\n' "$TAG" > "$notes"
          fi
          cat "$notes"
          if gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes"; then
            echo "created the GitHub Release $TAG"
          else
            echo "::warning::gh release create $TAG failed; the signed tag stands without a Release (by hand: python3 scripts/release_notes.py --tag $TAG > notes.md && gh release create $TAG --verify-tag --notes-file notes.md)"
          fi
