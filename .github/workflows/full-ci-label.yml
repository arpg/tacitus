# Adding the `full-ci` label to a pull request starts a full CI run on its
# branch (ci.yml through Run workflow), so the label is the whole opt-in. A
# label event cannot start ci.yml itself without also starting a run for
# every other label, whose skipped checks would stand in for real ones.
# The check runs land on the branch's head commit, which is the pull
# request's. A pull request from a fork has a read-only token here and a
# branch this repository does not have, so the job skips it: with the
# label on, ci.yml runs the full tiers on the fork's next push or when it
# is marked ready; to run them now, push its head commit to a branch here
# (ci/pr-<number>), Run workflow on that branch, then delete the branch.
name: full-ci label

on:
  pull_request:
    types: [labeled]

permissions:
  actions: write
  contents: read

jobs:
  start-full-ci:
    if: github.event.label.name == 'full-ci' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Run CI on the branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
