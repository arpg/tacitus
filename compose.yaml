# The EA as containers. Quick start, login, profiles and upgrades:
# docs/docker.md. Settings come from .env next to this file
# (deploy/docker/env.example lists them).
#
#   docker compose run --rm setup                 the first configuration, once
#   docker compose up -d                          email or review-only profile
#   docker compose --profile assistant up -d      adds the chat bot and its web chat
#   docker compose --profile zulip up -d          adds a self-hosted Zulip
#   docker compose run --rm agent claude          Claude as ea-bot (auth login)
#   docker compose run --rm owner <command>       a command as the owner
name: ea-system

x-ea: &ea
  image: ${EA_IMAGE:-ea-system:local}
  build:
    context: .
    args:
      # One value names the owner user in the image and its home below.
      OWNER_USER: ${OWNER_USER:-owner}
      OWNER_UID: ${OWNER_UID:-1000}
      OWNER_GID: ${OWNER_GID:-1000}
      EA_GID: ${EA_GID:-1001}
      EA_BOT_UID: ${EA_BOT_UID:-999}
      WITH_BROWSER: ${EA_WITH_BROWSER:-1}
  # A small init as PID 1 reaps the processes Claude runs leave behind.
  init: true
  environment:
    TZ: ${TZ:-UTC}
    EA_PROFILE: ${EA_PROFILE:-email}
    EA_MAIL_MEDIATION: ${EA_MAIL_MEDIATION:-1}
    # The address the owner opens the web chat at, behind a TLS proxy; the
    # setup role writes it into the owner-private chat.json.
    WEBCHAT_PUBLIC_URL: ${WEBCHAT_PUBLIC_URL:-}
    # The doctor's container wording (docs/docker.md, Web chat).
    EA_CONTAINER: docker
  volumes:
    # ea-bot space: state, config, the ledger, plugins (~/.ea on a host).
    - ea-data:/home/ea-bot/.ea
    # The owner's secrets and logs (~/.ea-private on a host, mode 0700).
    - ea-private:/home/${OWNER_USER:-owner}/.ea-private
    # ea-bot's Claude Code login, config and session transcripts.
    - ea-bot-claude:/home/ea-bot/.claude

x-after-init: &after-init
  init:
    condition: service_completed_successfully

services:
  # Prepares the volumes (directories, modes, config templates, mediation)
  # and renders the install overlay on every `up`, then exits. The bot,
  # agent and owner roles install the overlay in their own copy of the
  # deployed tree at start (docs/docker.md, Install overlay).
  init:
    <<: *ea
    command: ["init"]
    restart: "no"

  # The owner-side executor of the agent's safe mail operations. It holds
  # the Graph and Gmail tokens; ea-bot cannot read them.
  mediator:
    <<: *ea
    command: ["mediator"]
    restart: unless-stopped
    depends_on: *after-init

  # The cron jobs of the install profile, run by supercronic as the owner.
  scheduler:
    <<: *ea
    command: ["scheduler"]
    restart: unless-stopped
    depends_on: *after-init

  # The chat bot. The assistant profile only. Its web chat listens on
  # port 8470 of the container (chat.json binds every interface there;
  # deploy/docker/chat_seed.py): a TLS proxy on this network reaches
  # bot:8470, one on the host 127.0.0.1:${WEBCHAT_PORT}. Never publish it
  # on another address: TLS goes in front (docs/docker.md, Web chat).
  bot:
    <<: *ea
    command: ["bot"]
    restart: unless-stopped
    profiles: ["assistant"]
    expose:
      - "8470"
    ports:
      - "127.0.0.1:${WEBCHAT_PORT:-8470}:8470"
    # The web chat answers on the container's loopback (the entrypoint's
    # health role); a chat block without the web chat passes.
    healthcheck:
      test: ["CMD", "/usr/local/bin/ea-entrypoint", "health"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    depends_on:
      init:
        condition: service_completed_successfully
      mediator:
        condition: service_started

  # The first configuration, one interactive run (docs/docker.md, First
  # run): the config questions as ea-bot, ~/.ea/.env and the owner's
  # secrets, the Claude login as ea-bot, the mail sign-in as the owner,
  # the overlay, then the doctor. On the host's network, so a
  # confidential-client redirect to localhost:8400 reaches it.
  # `docker compose run --rm -v ./answers.json:/answers.json:ro setup
  # --answers /answers.json` runs it with no prompts (the install tests).
  setup:
    <<: *ea
    entrypoint: ["/usr/local/bin/ea-entrypoint", "setup"]
    command: []
    profiles: ["setup"]
    network_mode: host
    stdin_open: true
    tty: true
    depends_on: *after-init

  # Interactive helpers, never started by `up`. The role sits in the
  # entrypoint, so `docker compose run --rm agent <command>` runs the
  # command as ea-bot and `... run --rm owner <command>` as the owner.
  agent:
    <<: *ea
    entrypoint: ["/usr/local/bin/ea-entrypoint", "agent"]
    command: ["bash"]
    profiles: ["tools"]
    stdin_open: true
    tty: true
    depends_on: *after-init

  owner:
    <<: *ea
    entrypoint: ["/usr/local/bin/ea-entrypoint", "owner"]
    command: ["bash"]
    profiles: ["tools"]
    stdin_open: true
    tty: true
    depends_on: *after-init

  # The owner role on the host's network, for sign-ins whose redirect goes
  # to localhost (the Graph auth-code flow listens on localhost:8400).
  signin:
    <<: *ea
    entrypoint: ["/usr/local/bin/ea-entrypoint", "owner"]
    command: ["python3", "/opt/ea-system/preprocessor/graph_client.py"]
    profiles: ["tools"]
    network_mode: host
    stdin_open: true
    tty: true
    depends_on: *after-init

  # Self-hosted Zulip, adapted from deploy/zulip/docker-compose.yml. Every
  # image is pinned by digest. HTTP only, on 127.0.0.1:${EA_ZULIP_PORT}.
  # Containers reach it as http://${ZULIP_HOSTNAME} (a network alias), the
  # browser on this machine as http://${ZULIP_HOSTNAME}:${EA_ZULIP_PORT}.
  zulip-database:
    image: "zulip/zulip-postgresql:14@sha256:e71ba8616fa42cdc1b248f51263d9290c29681cb8c1992eb9b498af0bb656b29"
    profiles: ["zulip"]
    restart: unless-stopped
    secrets:
      - zulip__postgres_password
    environment:
      POSTGRES_DB: "zulip"
      POSTGRES_USER: "zulip"
      POSTGRES_PASSWORD_FILE: /run/secrets/zulip__postgres_password
    volumes:
      - "zulip-postgresql-14:/var/lib/postgresql/data:rw"

  zulip-memcached:
    # memcached 1.6.45
    image: "memcached:alpine@sha256:9e4de012dc607573052061c0bcb38abc775e1dd59b24e7ac38d1892842094aaf"
    profiles: ["zulip"]
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - |
        echo 'mech_list: plain' > "$$SASL_CONF_PATH"
        echo "zulip@$$HOSTNAME:$$(cat $$MEMCACHED_PASSWORD_FILE)" > "$$MEMCACHED_SASL_PWDB"
        echo "zulip@localhost:$$(cat $$MEMCACHED_PASSWORD_FILE)" >> "$$MEMCACHED_SASL_PWDB"
        exec memcached -S
    secrets:
      - zulip__memcached_password
    environment:
      SASL_CONF_PATH: "/home/memcache/memcached.conf"
      MEMCACHED_SASL_PWDB: "/home/memcache/memcached-sasl-db"
      MEMCACHED_PASSWORD_FILE: /run/secrets/zulip__memcached_password

  zulip-rabbitmq:
    # RabbitMQ 4.2.9
    image: "rabbitmq:4.2@sha256:b57bbe940994d0c387b44b6567dae0ec9991d5e4f0e0f7faffa0a98f9f331099"
    profiles: ["zulip"]
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - |
        export RABBITMQ_DEFAULT_PASS="$$(cat $$RABBITMQ_PASSWORD_FILE)"
        echo 'default_user = $$(RABBITMQ_DEFAULT_USER)' >> /etc/rabbitmq/rabbitmq.conf
        echo 'default_pass = $$(RABBITMQ_DEFAULT_PASS)' >> /etc/rabbitmq/rabbitmq.conf
        exec docker-entrypoint.sh rabbitmq-server
    secrets:
      - zulip__rabbitmq_password
    environment:
      RABBITMQ_DEFAULT_USER: "zulip"
      RABBITMQ_PASSWORD_FILE: /run/secrets/zulip__rabbitmq_password
    volumes:
      - "zulip-rabbitmq:/var/lib/rabbitmq:rw"

  zulip-redis:
    # Redis 8.10.2
    image: "redis:alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0"
    profiles: ["zulip"]
    restart: unless-stopped
    command:
      - "sh"
      - "-euc"
      - '/usr/local/bin/docker-entrypoint.sh --requirepass "$$(cat $$REDIS_PASSWORD_FILE)"'
    secrets:
      - zulip__redis_password
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/zulip__redis_password
    volumes:
      - "zulip-redis:/data:rw"

  zulip:
    image: "ghcr.io/zulip/zulip-server:12.3-0@sha256:76a1ecc4ba5470869d9609ef1ec16497b410189918b2daba85862183a59aa275"
    profiles: ["zulip"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EA_ZULIP_PORT:-8090}:80"
    networks:
      default:
        aliases:
          - "${ZULIP_HOSTNAME:-zulip.localhost}"
    secrets:
      - zulip__postgres_password
      - zulip__memcached_password
      - zulip__rabbitmq_password
      - zulip__redis_password
      - zulip__secret_key
    environment:
      SETTING_REMOTE_POSTGRES_HOST: "zulip-database"
      SETTING_MEMCACHED_LOCATION: "zulip-memcached:11211"
      SETTING_RABBITMQ_HOST: "zulip-rabbitmq"
      SETTING_REDIS_HOST: "zulip-redis"
      # Zulip refuses a host without a dot; every name under .localhost
      # resolves to loopback in browsers and systemd-resolved.
      SETTING_EXTERNAL_HOST: "${ZULIP_HOSTNAME:-zulip.localhost}:${EA_ZULIP_PORT:-8090}"
      SETTING_ZULIP_ADMINISTRATOR: "${ZULIP_ADMIN_EMAIL:-admin@zulip.localhost}"
      # HTTP only inside the container (the 12.x image's empty CERTIFICATES).
      CERTIFICATES: ""
      TRUST_GATEWAY_IP: "True"
      # No mail server: outgoing mail goes to the container log.
      SETTING_EMAIL_BACKEND: "django.core.mail.backends.console.EmailBackend"
      CONFIG_application_server__queue_workers_multiprocess: "False"
      CONFIG_application_server__uwsgi_processes: "2"
      ZULIP_CUSTOM_SETTINGS: |
        ZULIP_SERVICE_PUSH_NOTIFICATIONS = True
        ZULIP_SERVICE_SUBMIT_USAGE_STATISTICS = False
        PUSH_NOTIFICATION_REDACT_CONTENT = True
    volumes:
      - "zulip-data:/data:rw"
    ulimits:
      nofile:
        soft: 1000000
        hard: 1048576
    depends_on:
      - zulip-database
      - zulip-memcached
      - zulip-rabbitmq
      - zulip-redis

secrets:
  zulip__postgres_password:
    environment: "ZULIP__POSTGRES_PASSWORD"
  zulip__memcached_password:
    environment: "ZULIP__MEMCACHED_PASSWORD"
  zulip__rabbitmq_password:
    environment: "ZULIP__RABBITMQ_PASSWORD"
  zulip__redis_password:
    environment: "ZULIP__REDIS_PASSWORD"
  zulip__secret_key:
    environment: "ZULIP__SECRET_KEY"

volumes:
  ea-data:
  ea-private:
  ea-bot-claude:
  zulip-data:
  zulip-postgresql-14:
  zulip-rabbitmq:
  zulip-redis:
