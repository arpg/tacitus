<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 548" width="1000" height="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The switches: one owner-only file</title>
  <rect x="0.5" y="0.5" width="999" height="547" rx="12" fill="#ffffff" stroke="#deded8"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#1d1d1b">The switches: one owner-only file</text>
  <text x="24" y="56" font-size="13" fill="#6b6b66">~&lt;owner&gt;/.ea-private/remote-llm.json (0600, the owner). Read on every call, so a change takes effect on the next run. No restart.</text>
  <text x="24" y="76" font-size="13" fill="#6b6b66">The filled value is the one set now. ea-bot can neither read this file nor write it.</text>

  <!-- header -->
  <text x="24" y="110" font-size="12" font-weight="600" fill="#6b6b66">KEY</text>
  <text x="150" y="110" font-size="12" font-weight="600" fill="#6b6b66">VALUES</text>
  <text x="472" y="110" font-size="12" font-weight="600" fill="#6b6b66">WHAT THE SET VALUE DOES</text>
  <line x1="24" y1="118" x2="976" y2="118" stroke="#deded8"/>

  <!-- mail -->
  <text x="24" y="150" font-size="15" font-weight="600" fill="#1d1d1b" font-family="ui-monospace, Menlo, Consolas, monospace">mail</text>
  <rect x="150" y="133" width="56" height="26" rx="13" fill="#ffffff" stroke="#9a9a93"/><text x="178" y="151" font-size="12" fill="#55554f" text-anchor="middle">off</text>
  <rect x="214" y="133" width="72" height="26" rx="13" fill="#ffffff" stroke="#9a9a93"/><text x="250" y="151" font-size="12" fill="#55554f" text-anchor="middle">shadow</text>
  <rect x="294" y="133" width="80" height="26" rx="13" fill="#2f5d8a" stroke="#2f5d8a"/><text x="334" y="151" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">enforce</text>
  <text x="472" y="144" font-size="12.5" fill="#1d1d1b">The mail gate: Claude lanes get the remote summary of actionable mail only.</text>
  <text x="472" y="162" font-size="12.5" fill="#1d1d1b">FYI and kept mail go to mail-digest. The tagger runs on the remote model.</text>
  <text x="472" y="180" font-size="12.5" fill="#1d1d1b">Cron lanes cannot read kept threads. No end date.</text>
  <line x1="24" y1="196" x2="976" y2="196" stroke="#eeeeea"/>

  <!-- drafting -->
  <text x="24" y="228" font-size="15" font-weight="600" fill="#1d1d1b" font-family="ui-monospace, Menlo, Consolas, monospace">drafting</text>
  <rect x="150" y="211" width="56" height="26" rx="13" fill="#ffffff" stroke="#9a9a93"/><text x="178" y="229" font-size="12" fill="#55554f" text-anchor="middle">off</text>
  <rect x="214" y="211" width="56" height="26" rx="13" fill="#ffffff" stroke="#9a9a93"/><text x="242" y="229" font-size="12" fill="#55554f" text-anchor="middle">ab</text>
  <rect x="278" y="211" width="80" height="26" rx="13" fill="#2e7d5b" stroke="#2e7d5b"/><text x="318" y="229" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">remote</text>
  <text x="472" y="222" font-size="12.5" fill="#1d1d1b">email_writer.py writes every email body; the email-author subagent</text>
  <text x="472" y="240" font-size="12.5" fill="#1d1d1b">writes only on a fallback and for letters. Edits at Send are recorded.</text>
  <text x="472" y="258" font-size="12.5" fill="#1d1d1b">No end date. (ab was the blind A/B test; it ran until this choice.)</text>
  <line x1="24" y1="274" x2="976" y2="274" stroke="#eeeeea"/>

  <!-- digests -->
  <text x="24" y="306" font-size="15" font-weight="600" fill="#1d1d1b" font-family="ui-monospace, Menlo, Consolas, monospace">digests</text>
  <rect x="150" y="289" width="56" height="26" rx="13" fill="#ffffff" stroke="#9a9a93"/><text x="178" y="307" font-size="12" fill="#55554f" text-anchor="middle">off</text>
  <rect x="214" y="289" width="80" height="26" rx="13" fill="#6b4fa0" stroke="#6b4fa0"/><text x="254" y="307" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">remote</text>
  <text x="472" y="300" font-size="12.5" fill="#1d1d1b">The list digest (15:30, 18:30) and the admissions digest (Mon 08:00)</text>
  <text x="472" y="318" font-size="12.5" fill="#1d1d1b">are judged by the remote model and post to mail-digest. Off: the</text>
  <text x="472" y="336" font-size="12.5" fill="#1d1d1b">same cron line runs the old Claude lane.</text>
  <line x1="24" y1="352" x2="976" y2="352" stroke="#eeeeea"/>

  <!-- briefings -->
  <text x="24" y="384" font-size="15" font-weight="600" fill="#1d1d1b" font-family="ui-monospace, Menlo, Consolas, monospace">briefings</text>
  <rect x="150" y="367" width="56" height="26" rx="13" fill="#ffffff" stroke="#9a9a93"/><text x="178" y="385" font-size="12" fill="#55554f" text-anchor="middle">off</text>
  <rect x="214" y="367" width="80" height="26" rx="13" fill="#b4572e" stroke="#b4572e"/><text x="254" y="385" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">remote</text>
  <text x="472" y="378" font-size="12.5" fill="#1d1d1b">The morning briefing (04:00) and the afternoon update (15:00) are written</text>
  <text x="472" y="396" font-size="12.5" fill="#1d1d1b">by the remote model; it drafts easy replies and hands hard items to Claude.</text>
  <text x="472" y="414" font-size="12.5" fill="#1d1d1b">The Sunday audit stays on Claude. Off: the Claude lanes run.</text>
  <line x1="24" y1="430" x2="976" y2="430" stroke="#eeeeea"/>

  <!-- scheduling -->
  <text x="24" y="462" font-size="15" font-weight="600" fill="#1d1d1b" font-family="ui-monospace, Menlo, Consolas, monospace">scheduling</text>
  <rect x="150" y="445" width="56" height="26" rx="13" fill="#ffffff" stroke="#9a9a93"/><text x="178" y="463" font-size="12" fill="#55554f" text-anchor="middle">off</text>
  <rect x="214" y="445" width="80" height="26" rx="13" fill="#9a9a93" stroke="#9a9a93"/><text x="254" y="463" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">shadow</text>
  <text x="472" y="456" font-size="12.5" fill="#1d1d1b">The remote scheduling agent runs beside Claude and records what it</text>
  <text x="472" y="474" font-size="12.5" fill="#1d1d1b">would do. Nothing it does is posted or staged. Stops after shadow_until.</text>
  <line x1="24" y1="490" x2="976" y2="490" stroke="#deded8"/>

  <!-- keep list -->
  <text x="24" y="520" font-size="13" font-weight="600" fill="#8c1d18" font-family="ui-monospace, Menlo, Consolas, monospace">keep_from_frontier</text>
  <text x="200" y="520" font-size="12.5" fill="#1d1d1b">domains and addresses (plus applicant mail) kept from every hosted model, by keep level. It never limits the remote model.</text>
</svg>
