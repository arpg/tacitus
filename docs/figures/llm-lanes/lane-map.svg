<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Where mail goes with the mail switch at enforce</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55554f"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4572e"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="609" rx="12" fill="#ffffff" stroke="#deded8"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#1d1d1b">Where mail goes with the mail switch at enforce</text>
  <text x="24" y="56" font-size="13" fill="#6b6b66">The remote model reads every message first. Code, not a model, decides what the Claude lanes receive.</text>

  <!-- mailbox -->
  <rect x="24" y="226" width="150" height="96" rx="10" fill="#f4f4f1" stroke="#9a9a93"/>
  <text x="99" y="262" font-size="15" font-weight="600" fill="#1d1d1b" text-anchor="middle">Outlook</text>
  <text x="99" y="282" font-size="15" font-weight="600" fill="#1d1d1b" text-anchor="middle">mailbox</text>
  <text x="99" y="304" font-size="12" fill="#6b6b66" text-anchor="middle">about 90 a weekday</text>

  <!-- remote model -->
  <rect x="222" y="196" width="210" height="156" rx="10" fill="#e6f3ec" stroke="#2e7d5b"/>
  <text x="327" y="224" font-size="15" font-weight="600" fill="#1f5c42" text-anchor="middle">Remote model</text>
  <text x="327" y="243" font-size="12" fill="#1f5c42" text-anchor="middle">qwen3.8-mm, the remote server</text>
  <text x="238" y="270" font-size="12" fill="#1d1d1b">One record per message:</text>
  <text x="238" y="288" font-size="12" fill="#1d1d1b">state, ask, due date, summary,</text>
  <text x="238" y="306" font-size="12" fill="#1d1d1b">offered times, keep label</text>
  <text x="238" y="334" font-size="11" fill="#6b6b66">mail_privacy.py tick, every 10 min</text>

  <!-- gate -->
  <rect x="480" y="196" width="210" height="156" rx="10" fill="#e8eef5" stroke="#2f5d8a"/>
  <text x="585" y="224" font-size="15" font-weight="600" fill="#22476b" text-anchor="middle">Mail gate</text>
  <text x="585" y="243" font-size="12" fill="#22476b" text-anchor="middle">mail_gate.Gate, in the preprocessor</text>
  <text x="496" y="270" font-size="12" fill="#1d1d1b">Detectors read the raw inbox.</text>
  <text x="496" y="288" font-size="12" fill="#1d1d1b">Their output is filtered and</text>
  <text x="496" y="306" font-size="12" fill="#1d1d1b">rewritten before the ledger,</text>
  <text x="496" y="324" font-size="12" fill="#1d1d1b">the queue or a lane sees it.</text>

  <!-- destinations -->
  <rect x="742" y="84" width="234" height="122" rx="10" fill="#fbeee7" stroke="#b4572e"/>
  <text x="859" y="110" font-size="15" font-weight="600" fill="#8a3f1f" text-anchor="middle">Lanes on the gated feed</text>
  <text x="756" y="134" font-size="12" fill="#1f5c42">remote: the two daily briefings</text>
  <text x="756" y="152" font-size="12" fill="#1d1d1b">Claude: Sunday audit, scheduling</text>
  <text x="756" y="170" font-size="12" fill="#1d1d1b">Claude: one thread per hand-off</text>
  <text x="756" y="194" font-size="11" fill="#6b6b66">email bodies come from email_writer.py</text>

  <rect x="742" y="236" width="234" height="122" rx="10" fill="#efeaf7" stroke="#6b4fa0"/>
  <text x="859" y="262" font-size="15" font-weight="600" fill="#4f3780" text-anchor="middle">Mail digests channel</text>
  <text x="756" y="286" font-size="12" fill="#1d1d1b">Private; you and the bot only.</text>
  <text x="756" y="304" font-size="12" fill="#1d1d1b">Code writes it from the remote</text>
  <text x="756" y="322" font-size="12" fill="#1d1d1b">records. The list and admissions</text>
  <text x="756" y="340" font-size="12" fill="#1d1d1b">digests post here too.</text>

  <rect x="742" y="388" width="234" height="86" rx="10" fill="#f4f4f1" stroke="#9a9a93" stroke-dasharray="5 4"/>
  <text x="859" y="414" font-size="15" font-weight="600" fill="#3d3d39" text-anchor="middle">Held for a later run</text>
  <text x="756" y="438" font-size="12" fill="#1d1d1b">Not read by the remote model yet.</text>
  <text x="756" y="456" font-size="12" fill="#1d1d1b">After 4 h: sender and subject only.</text>

  <!-- flows -->
  <line x1="174" y1="274" x2="216" y2="274" stroke="#55554f" stroke-width="2" marker-end="url(#a)"/>
  <line x1="432" y1="274" x2="474" y2="274" stroke="#55554f" stroke-width="2" marker-end="url(#a)"/>
  <path d="M690,236 C716,236 716,145 736,145" fill="none" stroke="#b4572e" stroke-width="2.5" marker-end="url(#aw)"/>
  <path d="M690,290 C716,290 716,297 736,297" fill="none" stroke="#6b4fa0" stroke-width="2.5" marker-end="url(#ap)"/>
  <path d="M690,334 C716,334 716,431 736,431" fill="none" stroke="#9a9a93" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="480" y="128" font-size="12" fill="#8a3f1f">Actionable mail (about 40%):</text>
  <text x="480" y="146" font-size="12" fill="#8a3f1f">the remote summary, ask, due date</text>
  <text x="480" y="164" font-size="12" fill="#8a3f1f">and ids. Never the message text.</text>
  <text x="480" y="384" font-size="12" fill="#4f3780">FYI (about 60%) and kept mail.</text>
  <text x="480" y="402" font-size="12" fill="#4f3780">Claude does not see it.</text>

  <!-- on-request path -->
  <rect x="222" y="514" width="468" height="70" rx="10" fill="#fbeee7" stroke="#b4572e" stroke-dasharray="6 4"/>
  <text x="456" y="540" font-size="14" font-weight="600" fill="#8a3f1f" text-anchor="middle">Rooms, threads and the DM (bot runs)</text>
  <text x="456" y="562" font-size="12" fill="#1d1d1b" text-anchor="middle">pull one thread through the mediator when they act or when you ask</text>
  <path d="M99,322 L99,549 L216,549" fill="none" stroke="#b4572e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aw)"/>
  <text x="108" y="440" font-size="12" fill="#8a3f1f">one thread,</text>
  <text x="108" y="456" font-size="12" fill="#8a3f1f">on request</text>

  <!-- refusal -->
  <rect x="742" y="506" width="234" height="78" rx="10" fill="#fdecea" stroke="#b3261e"/>
  <text x="859" y="532" font-size="14" font-weight="600" fill="#8c1d18" text-anchor="middle">Kept threads</text>
  <text x="756" y="554" font-size="12" fill="#1d1d1b">A cron lane's read is refused at</text>
  <text x="756" y="572" font-size="12" fill="#1d1d1b">the mediator. A room's read is not.</text>
</svg>
